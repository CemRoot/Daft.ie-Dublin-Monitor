services:
  - type: web
    name: daft-monitor-bot
    env: python
    branch: daft-monitor-setup-2684401370211648289
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 bot:app"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      # RENDER_EXTERNAL_URL is set automatically by Render for web services.
      # Optional overrides: WEBHOOK_URL, WEBHOOK_SECRET
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        sync: false
